<div class="container mt-4">
  <h2 class="mb-4 text-primary">Add New Password</h2>
  <form (ngSubmit)="onSubmit(form)" #form="ngForm" novalidate>
    <div class="form-group mb-3">
      <label for="category">Category</label>
      <input
        type="text"
        id="category"
        class="form-control"
        required
        [(ngModel)]="newPassword.category"
        name="category"
        #category="ngModel"
[class.is-invalid]="category.invalid && category.touched"
      />
      <div *ngIf="category.invalid && category.touched" class="invalid-feedback">
        Category is required.
      </div>
    </div>
 
    <div class="form-group mb-3">
      <label for="app">App</label>
      <input
        type="text"
        id="app"
        class="form-control"
        required
[(ngModel)]="newPassword.app"
        name="app"
        #app="ngModel"
[class.is-invalid]="app.invalid && app.touched"
      />
      <div *ngIf="app.invalid && app.touched" class="invalid-feedback">
        App is required.
      </div>
    </div>
 
    <div class="form-group mb-3">
      <label for="userName">UserName</label>
      <input
        type="email"
        id="userName"
        class="form-control"
        required
        [(ngModel)]="newPassword.userName"
        name="userName"
        #userName="ngModel"
[class.is-invalid]="userName.invalid && userName.touched"
      />
      <div *ngIf="userName.invalid && userName.touched" class="invalid-feedback">
        Enter a valid email address.
      </div>
    </div>
 
    <div class="form-group mb-4">
      <label for="decryptedPassword">Password</label>
      <input
        type="password"
        id="decryptedPassword"
        class="form-control"
        required
        minlength="6"
        [(ngModel)]="newPassword.decryptedPassword"
        name="decryptedPassword"
        #decryptedPassword="ngModel"
[class.is-invalid]="decryptedPassword.invalid && decryptedPassword.touched"
      />
      <div *ngIf="decryptedPassword.invalid && decryptedPassword.touched" class="invalid-feedback">
        Password must be at least 6 characters long.
      </div>
    </div>
 
    <button class="btn btn-info px-4" type="submit" [disabled]="form.invalid">Save</button>
  </form>
</div>
