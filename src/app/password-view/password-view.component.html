<div class="container mt-5" *ngIf="password">
  <div class="card shadow-lg rounded-4 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0 text-primary">Password Details</h3>
      <button class="btn btn-outline-primary" (click)="toggleEdit()">
        {{ isEditing ? 'Cancel' : 'Edit' }}
      </button>
    </div>
 
    <!-- Edit Mode -->
    <form *ngIf="isEditing" #passwordForm="ngForm" (ngSubmit)="updatePassword()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="password.category"
            name="category"
            required
            #category="ngModel"
[class.is-invalid]="category.invalid && category.touched"
          />
          <div *ngIf="category.invalid && category.touched" class="invalid-feedback">
            Category is required.
          </div>
        </div>
 
        <div class="col-md-6">
          <label class="form-label">App</label>
          <input
            type="text"
            class="form-control"
[(ngModel)]="password.app"
            name="app"
            required
            #app="ngModel"
[class.is-invalid]="app.invalid && app.touched"
          />
          <div *ngIf="app.invalid && app.touched" class="invalid-feedback">
            App name is required.
          </div>
        </div>
 
        <div class="col-md-6">
          <label class="form-label">UserName</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="password.userName"
            name="userName"
            required
            #userName="ngModel"
[class.is-invalid]="userName.invalid && userName.touched"
          />
          <div *ngIf="userName.invalid && userName.touched" class="invalid-feedback">
            Enter a valid email address.
          </div>
        </div>
 
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="password.decryptedPassword"
            name="decryptedPassword"
            required
            minlength="6"
            #decryptedPassword="ngModel"
[class.is-invalid]="decryptedPassword.invalid && decryptedPassword.touched"
          />
          <div *ngIf="decryptedPassword.invalid && decryptedPassword.touched" class="invalid-feedback">
            Password is required (min 6 characters).
          </div>
        </div>
      </div>
 
      <div class="mt-4 text-end">
        <button type="submit" class="btn btn-success px-4" [disabled]="passwordForm.invalid">Save</button>
      </div>
    </form>
 
    <!-- View Mode -->
    <div *ngIf="!isEditing" class="mt-3">
      <p><strong>Category:</strong> {{ password.category }}</p>
      <p><strong>App: </strong>{{ password.app }}</p>
      <p><strong>UserName:</strong> {{ password.userName }}</p>
      <p>
        <strong>Password:</strong>
        <span class="me-2">{{ isDecrypted ? password.decryptedPassword : '********' }}</span>
        <button class="btn btn-sm btn-outline-secondary" (click)="toggleDecrypt()">
          {{ isDecrypted ? 'Hide' : 'Decrypt' }}
        </button>
      </p>
    </div>
  </div>
</div>
