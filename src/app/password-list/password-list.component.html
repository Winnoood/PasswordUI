<div class="container mt-5">
  <h2 class="mb-4 text-center text-primary">Stored Passwords</h2>
 
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-success" (click)="addPassword()">+ Add Password</button>
  </div>
 
  <div class="table-responsive shadow-sm rounded border">
    <table class="table table-striped table-bordered table-hover align-middle">
      <thead class="table-primary">
        <tr>
          <th>Category</th>
          <th>App</th>
          <th>UserName</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let password of pagedPasswords">
          <td>{{ password.category }}</td>
          <td>{{ password.app }}</td>
          <td>{{ password.userName }}</td>
          <td class="text-center">
<button class="btn btn-sm btn-outline-info me-2" (click)="viewPassword(password.id)">View</button>
<button class="btn btn-sm btn-outline-danger" (click)="deletePassword(password.id)">Delete</button>

          </td>
        </tr>
        <tr *ngIf="pagedPasswords.length === 0">
          <td colspan="4" class="text-center text-muted">No passwords found.</td>
        </tr>
      </tbody>
    </table>
  </div>
 
  <!-- Pagination -->
  <nav *ngIf="totalPages > 1" class="mt-3 d-flex justify-content-center">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(currentPage - 1)">Previous</button>
      </li>
 
      <li
        class="page-item"
        *ngFor="let page of [].constructor(totalPages); let i = index"
        [class.active]="i + 1 === currentPage"
      >
        <button class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</button>
      </li>
 
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="changePage(currentPage + 1)">Next</button>
      </li>
    </ul>
  </nav>
</div>
